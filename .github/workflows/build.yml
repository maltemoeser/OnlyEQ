name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Resolve packages
        # The Sparkle binary artifact is downloaded with a quarantine flag,
        # and Gatekeeper kills any process that loads a quarantined dylib.
        run: |
          swift package resolve
          xattr -dr com.apple.quarantine .build/artifacts || true

      - name: Run self-tests
        run: swift run -c release OnlyEQ --test

      - name: Build universal release app
        run: ./scripts/build-app.sh release

      - name: Archive
        # ditto keeps the framework symlinks Sparkle needs to verify the bundle.
        run: ditto -c -k --sequesterRsrc --keepParent build/OnlyEQ.app build/OnlyEQ.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OnlyEQ.app
          path: build/OnlyEQ.app.zip

      - name: Check tag matches Info.plist version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          plist=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [ "v$plist" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CFBundleShortVersionString $plist" >&2
            exit 1
          fi

      - name: Sign archive and generate appcast
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          work=build/appcast-work
          mkdir -p "$work"
          cp build/OnlyEQ.app.zip "$work/"
          [ -f "release-notes/$version.md" ] && cp "release-notes/$version.md" "$work/OnlyEQ.app.md"
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"
          .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle_key" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            --embed-release-notes \
            --maximum-versions 1 \
            --maximum-deltas 0 \
            "$work"
          rm -f "$RUNNER_TEMP/sparkle_key"
          cp "$work/appcast.xml" build/appcast.xml

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -f "release-notes/$version.md" ]; then
            notes=(--notes-file "release-notes/$version.md")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" build/OnlyEQ.app.zip build/appcast.xml \
            --title "OnlyEQ $version" "${notes[@]}"
