name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}

      - name: Run self-tests
        run: swift run OnlyEQ --test

      - name: Build universal app
        run: ./scripts/build-app.sh release

      - name: Archive
        run: ditto -c -k --sequesterRsrc --keepParent build/OnlyEQ.app build/OnlyEQ.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OnlyEQ.app
          path: build/OnlyEQ.app.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" build/OnlyEQ.app.zip \
            --title "OnlyEQ ${GITHUB_REF_NAME#v}" --generate-notes
